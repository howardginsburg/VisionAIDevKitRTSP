# Vision AI DevKit RTSP add-on: the vendor's display server (weston) runs only while HDMI live view is on
# (HDMI=1). camera/camd.sh creates the flag file and starts this unit, or removes it and stops the unit.
# weston then reads the add-on's weston.ini.
[Unit]
ConditionPathExists=/run/vaidk/hdmi-on

[Service]
Environment=XDG_CONFIG_HOME=/opt/vaidk/camera
