# Vision AI DevKit RTSP add-on: default settings. Changes made on the camera's setup page are
# saved to /data/misc/vaidk/vaidk.conf, which overrides these values.

# Camera name: setup page title, Frigate camera name and DHCP host name (letters, digits, dashes).
NAME=vision-ai-devkit

# Main stream: rtsp://<camera-ip>:8900/live. Codec 1 = H.264, 0 = H.265. Bitrates in bits/s.
MAIN_WIDTH=1920
MAIN_HEIGHT=1080
MAIN_FPS=30
MAIN_BITRATE=4000000
MAIN_CODEC=1

# Sub stream: rtsp://<camera-ip>:8901/live, always H.264 (SUB_ENABLED=0 turns it off).
SUB_ENABLED=1
SUB_WIDTH=640
SUB_HEIGHT=360
SUB_FPS=5
SUB_BITRATE=500000

# Microphone audio on the main stream (AAC-LC, 48 kHz mono). AUDIO_GAIN_DB is digital gain for
# the built-in microphones, 0 to 40 dB.
AUDIO_ENABLED=1
AUDIO_GAIN_DB=24
AUDIO_BITRATE=64000

# Seconds between keyframes on both video streams.
KEYFRAME_SECONDS=1

# Picture, adjusted while streaming. ANTIFLICKER: auto, 60, 50 or off; set it to your mains
# frequency (60 Hz in most of the Americas, 50 Hz in most other places) if lights band or flicker.
# EXPOSURE_EV: -2 to 2 (brighter or darker than the camera's own choice). WHITE_BALANCE: auto,
# daylight, cloudy, shade, twilight, incandescent, fluorescent or warm-fluorescent.
# SATURATION: 0 (black and white) to 10, normally 5. SHARPNESS: 0 to 6, normally 2.
ANTIFLICKER=auto
EXPOSURE_EV=0
WHITE_BALANCE=auto
SATURATION=5
SHARPNESS=2

# Text on the video. OVERLAY: off, time, name or time-name (date and time, camera name, or both).
# OVERLAY_POSITION is the corner for the date and time (top-left, top-right, bottom-left or
# bottom-right); the name goes on the other edge of the same side. OVERLAY_STREAMS: main, or both
# (the sub stream's ticking clock can set off Frigate's motion detection). TIME_ZONE: a POSIX TZ
# string for the clock, such as EST5EDT,M3.2.0,M11.1.0 (US Eastern) or CET-1CEST,M3.5.0,M10.5.0/3
# (Central Europe); the camera has no time zone database.
OVERLAY=off
OVERLAY_POSITION=top-left
OVERLAY_STREAMS=main
TIME_ZONE=UTC0

# Talk-back: a two-way audio channel on the main stream (Frigate's go2rtc uses it); the camera's
# speaker plays what arrives. SPEAKER_VOLUME: 0 to 100 on an audio taper (50 is about 12 dB below
# 100). TALKBACK_MUTE_MIC=1 mutes the microphones while the speaker plays, so the other end doesn't
# hear itself.
TALKBACK=1
SPEAKER_VOLUME=80
TALKBACK_MUTE_MIC=1

# Pan, tilt and zoom for Frigate, Home Assistant and NVRs over ONVIF on ONVIF_PORT (no password, like
# the streams). Digital: a crop of the 4K sensor, up to 4x, that both streams show. ONVIF=0 turns the
# service off and shows the whole picture.
ONVIF=1
ONVIF_PORT=8080

# Wi-Fi: open the setup access point after FALLBACK_AFTER seconds without the saved network.
# Close it again once Wi-Fi works and nobody has used it for AP_IDLE_EXIT seconds (but not
# before it has been open for AP_MIN_UP seconds).
FALLBACK_AFTER=300
AP_IDLE_EXIT=180
AP_MIN_UP=300
WIFI_COUNTRY=US

# Block network access to the vendor's unauthenticated control APIs (ports 1080 and 4000).
LOCK_CONTROL_API=1
# Keep the vendor preview server (ipc-webserver) stopped; it would compete for the camera.
STOP_IPC_WEBSERVER=1
